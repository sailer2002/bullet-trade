<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BulletTrade 实盘策略</title>
<style>
/* ================================================================
   bullet.css — BulletTrade 共享设计系统
   适用于：index.html / live_task.html 及后续所有页面
   ================================================================ */

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');

/* ── 设计令牌 ── */
:root {
  /* 色彩 */
  --bg:            #f5f6fa;
  --panel:         #ffffff;
  --text:          #1a1f36;
  --muted:         #8892a4;
  --border:        #e4e8f0;

  --primary:       #1a56db;
  --primary-hover: #1648c0;
  --primary-soft:  #eff4ff;

  --danger:        #e02d3c;
  --danger-hover:  #c8202e;
  --danger-soft:   #fef2f2;

  --success:       #0e9f6e;
  --success-soft:  #f0fdf4;

  --warn:          #d97706;
  --warn-soft:     #fffbeb;

  --nav-bg:        #1b2559;
  --nav-text:      #c8d0e7;

  /* 阴影 */
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10);
  --shadow-lg: 0 8px 40px rgba(0,0,0,.16);

  /* 字体 */
  --mono: "JetBrains Mono", Consolas, monospace;
  --ui:   "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;

  /* 圆角 */
  --radius:    6px;
  --radius-lg: 10px;

  /* 动效 */
  --ease: cubic-bezier(.4, 0, .2, 1);
  --duration: .15s;
}

/* ── 重置 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--ui);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, select, input, textarea { font: inherit; }
a { color: inherit; }

/* ================================================================
   导航栏
   ================================================================ */
.nav {
  background: var(--nav-bg);
  height: 52px;
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 32px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}

.nav-logo {
  color: #fff;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -.3px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  flex-shrink: 0;
}

.nav-links {
  display: flex;
  gap: 2px;
  margin-left: auto;
}

.nav-link {
  color: var(--nav-text);
  text-decoration: none;
  padding: 6px 13px;
  border-radius: var(--radius);
  font-size: 13px;
  transition: background var(--duration) var(--ease),
              color var(--duration) var(--ease);
}
.nav-link:hover  { background: rgba(255,255,255,.08); color: #fff; }
.nav-link.active { color: #fff; font-weight: 500; }

/* 面包屑（live_task 页面专用） */
.nav-breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--nav-text);
  font-size: 13px;
}
.nav-breadcrumb a {
  color: var(--nav-text);
  text-decoration: none;
  transition: color var(--duration);
}
.nav-breadcrumb a:hover { color: #fff; }
.nav-breadcrumb .sep     { opacity: .4; }
.nav-breadcrumb .current { color: #fff; font-weight: 500; }

/* ================================================================
   页面壳 & 页头
   ================================================================ */
.shell {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 24px 60px;
}

.page-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.page-head h1 {
  font-size: 20px;
  font-weight: 600;
  margin-right: auto;
}

/* ================================================================
   按钮
   ================================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 7px 14px;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: background var(--duration) var(--ease),
              border-color var(--duration) var(--ease),
              opacity var(--duration);
  white-space: nowrap;
  user-select: none;
}
.btn:hover:not(:disabled) { background: #eef0f6; }
.btn:active:not(:disabled){ transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn-primary {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.btn-primary:hover:not(:disabled) {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}

.btn-danger {
  color: var(--danger);
  background: var(--danger-soft);
  border-color: #fecaca;
}
.btn-danger:hover:not(:disabled) { background: #fee2e2; }

.btn-sm { padding: 4px 10px; font-size: 12px; }

/* 图标按钮 */
.icon-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background var(--duration), color var(--duration);
  flex-shrink: 0;
}
.icon-btn:hover         { background: #eef0f6; color: var(--text); }
.icon-btn-danger        { color: var(--danger); }
.icon-btn-success       { color: var(--success); }
.icon-btn-primary       { color: var(--primary); }

/* ================================================================
   卡片
   ================================================================ */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

/* tabs 上方的卡片顶部去掉上圆角 */
.card--tabs-below {
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

/* ================================================================
   标签页
   ================================================================ */
.tabs {
  display: flex;
  border-bottom: 2px solid var(--border);
}
.tab {
  padding: 9px 20px;
  font-size: 14px;
  cursor: pointer;
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color var(--duration), border-color var(--duration);
  user-select: none;
}
.tab:hover  { color: var(--text); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 500; }

/* ================================================================
   表格
   ================================================================ */
.task-table { width: 100%; border-collapse: collapse; }
.task-table th {
  background: #f8f9fc;
  padding: 10px 16px;
  text-align: left;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  letter-spacing: .2px;
}
.task-table td {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  vertical-align: middle;
}
.task-table tr:last-child td { border-bottom: none; }
.task-table tr:hover td      { background: #fafbfd; transition: background .1s; }

.task-name {
  font-weight: 500;
  font-size: 14px;
  color: var(--text);
  text-decoration: none;
}
.task-name:hover { color: var(--primary); text-decoration: underline; }
.task-id   { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }

.check-col input { cursor: pointer; width: 15px; height: 15px; accent-color: var(--primary); }
.empty-row td    { text-align: center; color: var(--muted); padding: 52px 16px; font-size: 14px; }

/* ================================================================
   徽章
   ================================================================ */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.badge::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}
.badge.running  { color: var(--success); background: var(--success-soft); }
.badge.starting { color: var(--primary); background: var(--primary-soft); animation: badge-pulse 1.6s infinite; }
.badge.stopped  { color: var(--muted);   background: #f1f2f6; }
.badge.error    { color: var(--danger);  background: var(--danger-soft); }

@keyframes badge-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .6; }
}

/* ================================================================
   数值 & 颜色辅助
   ================================================================ */
.num  { font-family: var(--mono); font-size: 13px; }
.up   { color: var(--success); }
.down { color: var(--danger); }
.flat { color: var(--muted); }

/* ================================================================
   日志区（抽屉 & 独立页均使用）
   ================================================================ */
.log-head {
  background: #0f172a;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

/* 抽屉模式：顶部圆角 */
.log-head--drawer { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }

.log-head-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.log-head-title { color: #94a3b8; font-size: 13px; font-family: var(--mono); }

/* 实时指示点 */
.log-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success);
  flex-shrink: 0;
  animation: dot-pulse 1.8s infinite;
}
.log-dot.inactive { background: #475569; animation: none; }
@keyframes dot-pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: .25; }
}

.log-head-actions { display: flex; align-items: center; gap: 8px; }

.log-action-btn {
  background: transparent;
  border: 1px solid rgba(100,116,139,.4);
  color: #64748b;
  border-radius: 4px;
  padding: 3px 8px;
  font-size: 11px;
  cursor: pointer;
  transition: color var(--duration), border-color var(--duration);
}
.log-action-btn:hover { color: #e2e8f0; border-color: rgba(226,232,240,.4); }

/* 关闭按钮（抽屉专用）*/
.log-close-btn {
  background: transparent;
  border: none;
  color: #64748b;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 12px;
  transition: color var(--duration);
}
.log-close-btn:hover { color: #e2e8f0; }

.log-box {
  background: #0f172a;
  color: #d7e1f5;
  overflow: auto;
  padding: 12px 16px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}
.log-box::-webkit-scrollbar       { width: 5px; height: 5px; }
.log-box::-webkit-scrollbar-track { background: transparent; }
.log-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

/* 日志行颜色 */
/* ── 日志行颜色变量 ── */
.log-line { display: block; }
.log-ts   { color: #6ea8fe; }              /* 日期时间：蓝色   */
.log-sep  { color: #475569; }              /* 分隔符 -         */
.log-lvl-system   { color: #c8960c; }     /* 系统  INFO：深黄 */
.log-lvl-strategy { color: #22c55e; }     /* 策略  INFO：深绿 */
.log-lvl-error    { color: #f87171; }     /* ERROR：红色      */
.log-lvl-warn     { color: #fbbf24; }     /* WARN：黄色       */
.log-msg  { color: #d7e1f5; }             /* 正文：原色       */
.log-msg-system   { color: #94a3b8; }     /* 系统正文：淡灰   */

/* ================================================================
   日志抽屉（index.html 专用）
   ================================================================ */
.log-drawer { margin-top: 20px; display: none; }
.log-drawer.open { display: block; }
.log-drawer .log-box { min-height: 180px; max-height: 340px; }

/* ================================================================
   弹窗
   ================================================================ */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.5);
  backdrop-filter: blur(3px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.overlay.open { display: flex; animation: fade-in .18s var(--ease); }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--panel);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 580px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slide-up .2s cubic-bezier(.34,1.2,.64,1);
}
@keyframes slide-up {
  from { opacity: 0; transform: translateY(18px) scale(.97); }
  to   { opacity: 1; transform: translateY(0)    scale(1);   }
}

.modal-head {
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-head h2 { font-size: 16px; font-weight: 600; }

.modal-close {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--muted);
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 18px;
  line-height: 1;
  transition: color var(--duration);
}
.modal-close:hover { color: var(--text); }

.modal-body { padding: 0 24px; }

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 24px 20px;
  border-top: 1px solid var(--border);
  margin-top: 8px;
}

/* ================================================================
   表单字段
   ================================================================ */
.form-field {
  display: grid;
  grid-template-columns: 90px 1fr;
  align-items: center;
  gap: 0 16px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.form-field:first-of-type { border-top: 1px solid var(--border); }
.form-field > label {
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
}

.inline-group  { display: flex; align-items: center; gap: 8px; }
.inline-label  { font-size: 13px; color: var(--text); white-space: nowrap; flex-shrink: 0; }
.select-sm { width: 88px !important; }
.input-sm  { width: 128px !important; }

.input, .select {
  width: 100%;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text);
  border-radius: var(--radius);
  padding: 8px 10px;
  outline: none;
  font-size: 13px;
  transition: border-color var(--duration), box-shadow var(--duration);
}
.input:focus, .select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26,86,219,.12);
}

.warn-box {
  display: none;
  padding: 10px 14px;
  border-radius: var(--radius);
  background: var(--warn-soft);
  border: 1px solid #fcd34d;
  color: var(--warn);
  font-size: 13px;
  margin: 14px 0 2px;
}

/* ================================================================
   底部注脚
   ================================================================ */
.footer-note { margin-top: 14px; font-size: 12px; color: var(--muted); }
.footer-note a { color: var(--primary); text-decoration: none; }
.footer-note a:hover { text-decoration: underline; }
.footer-note .warn-text { color: var(--danger); margin-left: 16px; }

/* ================================================================
   live_task 专用：元信息网格 & 状态条
   ================================================================ */
.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
}
.meta-item {
  padding: 14px 20px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.meta-item:last-child { border-right: none; }
.meta-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 5px;
}
.meta-value {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  font-family: var(--mono);
  word-break: break-all;
}

.status-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  background: #f8f9fc;
  border-bottom: 1px solid var(--border);
}
.status-bar-label { font-size: 13px; color: var(--muted); }
.status-bar-updated { font-size: 12px; color: var(--muted); margin-left: auto; }

/* live_task 日志区高度 */
.log-box--task { min-height: 380px; max-height: 62vh; }

/* ================================================================
   响应式
   ================================================================ */
@media (max-width: 720px) {
  .nav-links { display: none; }
  .meta-grid { grid-template-columns: 1fr 1fr; }

  .task-table th:nth-child(7),
  .task-table td:nth-child(7),
  .task-table th:nth-child(8),
  .task-table td:nth-child(8) { display: none; }
}

</style>
</head>
<body>

<!-- ── 导航 ── -->
<nav class="nav">
  <a class="nav-logo" href="/">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <rect x="2"  y="11" width="3" height="7"  rx="1" fill="#4f83f7"/>
      <rect x="7"  y="6"  width="3" height="12" rx="1" fill="#4f83f7"/>
      <rect x="12" y="2"  width="3" height="16" rx="1" fill="#7da9fb"/>
      <rect x="17" y="8"  width="3" height="10" rx="1" fill="#a8c3fd"/>
    </svg>
    BulletTrade
  </a>
  <nav class="nav-links" aria-label="主导航">
    <a class="nav-link"        href="#">首页</a>
    <a class="nav-link active" href="#">实盘策略</a>
    <a class="nav-link"        href="#">回测平台</a>
    <a class="nav-link"        href="#">帮助</a>
  </nav>
</nav>

<!-- ── 主体 ── -->
<div class="shell">

  <!-- 页头 -->
  <div class="page-head">
    <h1>实盘策略列表</h1>

    <button class="btn btn-primary" onclick="openModal()">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
        <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      新建实盘策略
    </button>

    <button class="btn btn-sm" onclick="openConfigModal()">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
        <circle cx="6.5" cy="6.5" r="4" stroke="currentColor" fill="none" stroke-width="1.5"/>
        <path d="M6.5 4v1M6.5 8v1M4 6.5h1M8 6.5h1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      配置
    </button>

    <button class="btn btn-danger btn-sm" id="batch-stop-btn" style="display:none" onclick="batchStop()">
      批量停止
    </button>

    <button class="btn btn-sm" style="margin-left:auto" onclick="refreshAll()" title="刷新列表">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
        <path d="M11.5 2A6 6 0 1 0 12.5 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M9.5 2h2v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      刷新
    </button>
  </div>

  <!-- 标签页 + 表格 -->
  <div class="tabs" role="tablist">
    <div class="tab active" data-tab="all"     role="tab" aria-selected="true"  onclick="switchTab('all')">全部</div>
    <div class="tab"        data-tab="running" role="tab" aria-selected="false" onclick="switchTab('running')">进行中</div>
    <div class="tab"        data-tab="stopped" role="tab" aria-selected="false" onclick="switchTab('stopped')">已关闭</div>
  </div>

  <div class="card card--tabs-below">
    <table class="task-table" role="grid">
      <thead>
        <tr>
          <th class="check-col"><input type="checkbox" id="check-all" onchange="toggleCheckAll(this)" aria-label="全选"></th>
          <th>名称</th>
          <th>频率</th>
          <th>状态</th>
          <th>开始日期</th>
          <th>累计收益</th>
          <th>Broker</th>
          <th>PID</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="task-tbody">
        <tr class="empty-row"><td colspan="9">暂无实盘任务</td></tr>
      </tbody>
    </table>
  </div>

  <p class="footer-note">
    <a href="#">有用功</a> | <a href="#">如何创建实盘策略</a>
    <span class="warn-text">注：盘中开启微信通知，当日不推送微信信号</span>
  </p>

  <!-- 日志抽屉 -->
  <div class="log-drawer" id="log-drawer" aria-live="polite">
    <div class="log-head log-head--drawer">
      <div class="log-head-left">
        <span class="log-dot inactive" id="log-dot" aria-hidden="true"></span>
        <span class="log-head-title" id="log-drawer-title">实时日志</span>
      </div>
      <div class="log-head-actions">
        <button class="log-action-btn" id="auto-scroll-btn" onclick="toggleAutoScroll()">自动滚动 ✓</button>
        <button class="log-action-btn" onclick="clearLog()">清空</button>
        <button class="btn btn-danger btn-sm" id="stop-btn" onclick="stopActiveTask()" disabled>停止任务</button>
        <button class="log-close-btn" onclick="closeDrawer()" aria-label="关闭日志">✕ 关闭</button>
      </div>
    </div>
    <div class="log-box" id="log-box" role="log">等待任务日志...</div>
  </div>

</div>

<!-- ── 新建弹窗 ── -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)" role="presentation">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">新建实盘交易</h2>
      <button class="modal-close" onclick="closeModal()" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <div class="warn-box" id="warn" role="alert" aria-live="polite"></div>

      <div class="form-field">
        <label for="live-name">交易名称</label>
        <input id="live-name" class="input" maxlength="40" placeholder="模拟交易-1" autocomplete="off">
      </div>

      <div class="form-field">
        <label for="strategy-file">选择策略</label>
        <select id="strategy-file" class="select">
          <option value="">请选择一个策略</option>
        </select>
      </div>

      <div class="form-field">
        <label for="backtest-select">选择回测</label>
        <select id="backtest-select" class="select">
          <option value="">请选择一个回测</option>
        </select>
      </div>

      <div class="form-field">
        <label for="init-cash">初始资金</label>
        <input id="init-cash" class="input" type="number" value="10000" min="1">
      </div>

      <div class="form-field">
        <label>运行频率</label>
        <div class="inline-group">
          <select id="frequency" class="select select-sm">
            <option value="day">每天</option>
            <option value="minute">每分钟</option>
            <option value="tick">Tick</option>
          </select>
          <label for="start-date" class="inline-label">开始日期</label>
          <input id="start-date" class="input input-sm" type="date" value="2026-04-01">
        </div>
      </div>

      <div class="form-field">
        <label for="broker">模拟交易位</label>
        <select id="broker" class="select">
          <option value="simulator">永久</option>
          <option value="qmt">本地 QMT</option>
          <option value="qmt-remote">远程 QMT</option>
        </select>
      </div>

      <textarea id="strategy-code" style="display:none" spellcheck="false"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="start-btn" onclick="startLive()">确定</button>
    </div>
  </div>
</div>

<!-- ── 配置弹窗 ── -->
<div class="overlay" id="config-overlay" onclick="handleConfigOverlayClick(event)" role="presentation">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="config-modal-title">
    <div class="modal-head">
      <h2 id="config-modal-title">实盘配置</h2>
      <button class="modal-close" onclick="closeConfigModal()" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="config-body">加载中...</div>
    <div class="modal-footer">
      <button class="btn" onclick="closeConfigModal()">取消</button>
      <button class="btn btn-primary" id="config-save-btn" onclick="saveConfig()">保存</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ── 状态 ── */
let tasks                = [];
let activeTaskId         = null;
let activeEventSource    = null;
let logStreamExpectedClose = false;
let nameTouched          = false;
let loadTasksInFlight    = null;
let currentTab           = 'all';
let checkedIds           = new Set();
let autoScroll           = true;

/* ── DOM 引用 ── */
const strategySelect  = document.getElementById('strategy-file');
const liveNameInput   = document.getElementById('live-name');
const brokerSelect    = document.getElementById('broker');
const codeTextarea    = document.getElementById('strategy-code');
const warnBox         = document.getElementById('warn');
const taskTbody       = document.getElementById('task-tbody');
const logBox          = document.getElementById('log-box');
const logDrawer       = document.getElementById('log-drawer');
const logDrawerTitle  = document.getElementById('log-drawer-title');
const logDot          = document.getElementById('log-dot');
const stopBtn         = document.getElementById('stop-btn');
const startBtn        = document.getElementById('start-btn');
const batchStopBtn    = document.getElementById('batch-stop-btn');
const overlay         = document.getElementById('overlay');
const configOverlay   = document.getElementById('config-overlay');
const configBody      = document.getElementById('config-body');

/* ── 表单事件 ── */
liveNameInput.addEventListener('input', () => { nameTouched = !!liveNameInput.value.trim(); });
strategySelect.addEventListener('change', () => loadStrategyContent(strategySelect.value));
brokerSelect.addEventListener('change', () => {
  if (brokerSelect.value !== 'simulator')
    showWarn('请确认对应券商环境已在 .env 中配置完成，否则实盘进程可能立即退出。');
  else hideWarn();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeConfigModal(); } });

/* ── 弹窗 ── */
function openModal()             { overlay.classList.add('open');       document.body.style.overflow = 'hidden'; hideWarn(); }
function closeModal()            { overlay.classList.remove('open');    document.body.style.overflow = ''; }
function handleOverlayClick(e)   { if (e.target === overlay) closeModal(); }
function openConfigModal()       { configOverlay.classList.add('open'); document.body.style.overflow = 'hidden'; loadConfig(); }
function closeConfigModal()      { configOverlay.classList.remove('open'); document.body.style.overflow = ''; }
function handleConfigOverlayClick(e) { if (e.target === configOverlay) closeConfigModal(); }

/* ── 提示 ── */
function showWarn(msg) { warnBox.textContent = msg; warnBox.style.display = 'block'; }
function hideWarn()    { warnBox.style.display = 'none'; }

/* ── 工具 ── */
function escapeHtml(v) {
  return String(v ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

async function fetchJson(url, opts = {}, ms = 8000) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try {
    const res  = await fetch(url, { cache: opts.method === 'POST' ? 'default' : 'no-store', ...opts, signal: ctrl.signal });
    const data = await res.json();
    return { res, data };
  } finally { clearTimeout(t); }
}

function _setBusy(v) { startBtn.disabled = v; }

/* ── 任务集合 ── */
function upsertTask(task) {
  if (!task?.task_id) return;
  const i = tasks.findIndex(t => t.task_id === task.task_id);
  if (i >= 0) tasks[i] = { ...tasks[i], ...task }; else tasks.unshift(task);
}
function removeTask(id) { tasks = tasks.filter(t => t.task_id !== id); }

/* ── 配置 ── */
async function loadConfig() {
  configBody.innerHTML = '<p style="padding:16px 0;color:var(--muted)">加载中...</p>';
  try {
    const { res, data } = await fetchJson('/api/live/config');
    if (!res.ok) { configBody.innerHTML = `<p>读取配置失败：HTTP ${res.status}</p>`; return; }
    const entries = Array.isArray(data.entries) ? data.entries : [];
    if (!entries.length) { configBody.innerHTML = '<p>未找到配置条目，请在 .env 文件中添加后刷新。</p>'; return; }
    configBody.innerHTML = entries.map(entry => {
      const key = escapeHtml(entry.key);
      const val = escapeHtml(entry.value ?? '');
      return `
        <div class="form-field" data-key="${key}">
          <label>${key}</label>
          <div class="inline-group">
            <input class="input" type="text" value="${val}" data-field="value"/>
            <label class="inline-label" style="min-width:60px">启用</label>
            <input type="checkbox" data-field="enabled" ${entry.enabled ? 'checked' : ''}/>
          </div>
        </div>`;
    }).join('');
  } catch (err) {
    configBody.innerHTML = `<p>读取配置失败：${escapeHtml(err.message)}</p>`;
  }
}

async function saveConfig() {
  const rows   = Array.from(configBody.querySelectorAll('.form-field'));
  const values = {};
  rows.forEach(row => {
    const key = row.dataset.key; if (!key) return;
    values[key] = {
      value:   row.querySelector('[data-field="value"]')?.value.trim() ?? '',
      enabled: row.querySelector('[data-field="enabled"]')?.checked ?? true,
    };
  });
  const btn = document.getElementById('config-save-btn');
  btn.disabled = true;
  try {
    const { res, data } = await fetchJson('/api/live/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values }),
    }, 15000);
    if (!res.ok || data.error) { alert(`保存失败: ${data.error ?? `HTTP ${res.status}`}`); return; }
    alert('配置保存成功'); closeConfigModal();
  } catch (err) { alert(`保存失败: ${err.message}`); }
  finally { btn.disabled = false; }
}

/* ── 策略 ── */
async function loadStrategies() {
  const { data } = await fetchJson('/api/strategies');
  const files = data.files ?? [];
  strategySelect.innerHTML = [
    '<option value="">请选择一个策略</option>',
    ...files.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`),
  ].join('');
}

async function loadStrategyContent(filename) {
  codeTextarea.value = '';
  if (!nameTouched) liveNameInput.value = '';
  if (!filename) return;
  const { res, data } = await fetchJson(`/api/strategy/${encodeURIComponent(filename)}`);
  if (!res.ok || data.error) { showWarn(data.error ?? `读取策略失败: HTTP ${res.status}`); return; }
  codeTextarea.value = data.code ?? '';
  if (!nameTouched || !liveNameInput.value.trim()) {
    liveNameInput.value = data.name ?? filename.replace(/\.py$/i, '');
    nameTouched = false;
  }
  hideWarn();
}

/* ── 任务加载 ── */
async function loadTasks() {
  if (loadTasksInFlight) return loadTasksInFlight;
  loadTasksInFlight = (async () => {
    const { data } = await fetchJson('/api/live/list', {}, 5000);
    tasks = data.tasks ?? [];
    renderTasks();
  })();
  try { await loadTasksInFlight; } finally { loadTasksInFlight = null; }
}

/* ── 渲染 ── */
const STATUS_LABELS = { running:'运行中', starting:'启动中', stopped:'已停止', error:'异常退出' };
const statusLabel = s => STATUS_LABELS[s] ?? s;

function colorNum(v) {
  const n = parseFloat(v);
  if (isNaN(n) || n === 0) return `<span class="num flat">${escapeHtml(v)}</span>`;
  return `<span class="num ${n > 0 ? 'up' : 'down'}">${escapeHtml(v)}</span>`;
}

function filteredTasks() {
  if (currentTab === 'running') return tasks.filter(t => t.status === 'running' || t.status === 'starting');
  if (currentTab === 'stopped') return tasks.filter(t => t.status === 'stopped' || t.status === 'error');
  return tasks;
}

function renderTasks() {
  const list = filteredTasks();
  if (!list.length) {
    taskTbody.innerHTML = '<tr class="empty-row"><td colspan="9">暂无实盘任务</td></tr>';
    batchStopBtn.style.display = 'none';
    return;
  }
  taskTbody.innerHTML = list.map(task => {
    const tid     = escapeHtml(task.task_id);
    const checked = checkedIds.has(task.task_id) ? 'checked' : '';
    const pnl     = task.pnl != null ? colorNum(task.pnl) : '<span class="num flat">-</span>';
    const canStop = task.can_stop;
    return `
    <tr>
      <td class="check-col">
        <input type="checkbox" ${checked} onchange="toggleCheck('${tid}', this.checked)" aria-label="选择 ${escapeHtml(task.name)}">
      </td>
      <td>
        <a class="task-name" href="/live/task?task=${tid}" target="_blank" rel="noopener">${escapeHtml(task.name || task.task_id)}</a>
        <div class="task-id">${tid}</div>
      </td>
      <td>${escapeHtml(task.frequency || '分钟')}</td>
      <td><span class="badge ${escapeHtml(task.status || 'stopped')}">${escapeHtml(statusLabel(task.status))}</span></td>
      <td>${escapeHtml((task.started_at || '-').split('T')[0].split(' ')[0])}</td>
      <td>${pnl}</td>
      <td>${escapeHtml(task.broker || '-')}</td>
      <td><span class="num">${escapeHtml(String(task.pid ?? '-'))}</span></td>
      <td>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="icon-btn icon-btn-primary" title="查看日志" onclick="viewTask('${tid}')" aria-label="查看日志">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M7 9h10M7 13h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          ${canStop
            ? `<button class="icon-btn icon-btn-danger" title="停止" onclick="stopTask('${tid}')" aria-label="停止">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
               </button>`
            : `<button class="icon-btn icon-btn-success" title="重启" onclick="restartTask('${tid}')" aria-label="重启">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5z" fill="currentColor"/></svg>
               </button>`
          }
          <button class="icon-btn icon-btn-danger" title="删除" onclick="deleteTask('${tid}')" aria-label="删除">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
              <path d="M6 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M9 7V5h6v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M8.5 7v12c0 .8.7 1.5 1.5 1.5h4c.8 0 1.5-.7 1.5-1.5V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('check-all').checked = list.length > 0 && list.every(t => checkedIds.has(t.task_id));
  batchStopBtn.style.display = checkedIds.size > 0 ? '' : 'none';
}

/* ── 标签切换 ── */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => {
    const active = el.dataset.tab === tab;
    el.classList.toggle('active', active);
    el.setAttribute('aria-selected', active);
  });
  renderTasks();
}

/* ── 批量 / 单选 ── */
function toggleCheck(id, checked) {
  if (checked) checkedIds.add(id); else checkedIds.delete(id);
  batchStopBtn.style.display = checkedIds.size > 0 ? '' : 'none';
}
function toggleCheckAll(el) {
  filteredTasks().forEach(t => { if (el.checked) checkedIds.add(t.task_id); else checkedIds.delete(t.task_id); });
  renderTasks();
}
async function batchStop() {
  for (const id of [...checkedIds]) await stopTask(id);
  checkedIds.clear(); renderTasks();
}

/* ── 启动 ── */
async function startLive() {
  const strategyFile = strategySelect.value;
  const name   = liveNameInput.value.trim();
  const code   = codeTextarea.value.trim();
  const broker = brokerSelect.value;
  if (!strategyFile) { showWarn('请选择一个策略文件。'); strategySelect.focus(); return; }
  if (!name)         { showWarn('请填写交易名称。');     liveNameInput.focus();  return; }
  if (!code)         { showWarn('策略代码为空，请先选择策略文件。'); return; }
  _setBusy(true);
  try {
    const { res, data } = await fetchJson('/api/live/start', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, broker, name }),
    }, 12000);
    if (!res.ok || data.error) { showWarn(data.error ?? `启动失败: HTTP ${res.status}`); return; }
    hideWarn(); closeModal();
    if (data.task) { upsertTask(data.task); renderTasks(); }
    await loadTasks().catch(() => {});
    if (data.task_id) viewTask(data.task_id);
  } catch (err) { showWarn(`启动失败: ${err.message}`); }
  finally { _setBusy(false); }
}

/* ── 停止 ── */
async function stopTask(taskId) {
  const snap = tasks.find(t => t.task_id === taskId);
  if (snap) { upsertTask({ ...snap, can_stop: false }); renderTasks(); }
  try {
    const { res, data } = await fetchJson(`/api/live/stop/${taskId}`, { method: 'POST' }, 12000);
    if (!res.ok || data.error || data.ok === false) throw new Error(data.error ?? `HTTP ${res.status}`);
    removeTask(taskId); checkedIds.delete(taskId); renderTasks();
    await loadTasks().catch(() => {});
  } catch (err) {
    if (snap) { upsertTask(snap); renderTasks(); }
    alert(`停止失败: ${err.message}`);
  } finally {
    if (taskId === activeTaskId) stopBtn.disabled = true;
  }
}

/* ── 重启 ── */
async function restartTask(taskId) {
  const snap = tasks.find(t => t.task_id === taskId);
  if (snap?.status === 'running') { alert('任务正在运行中，无法重启'); return; }
  try {
    const { res, data } = await fetchJson(`/api/live/restart/${taskId}`, { method: 'POST' }, 15000);
    if (!res.ok || data.error) throw new Error(data.error ?? `HTTP ${res.status}`);
    if (data.task) upsertTask(data.task);
    await loadTasks(); renderTasks();
  } catch (err) { alert(`重启失败: ${err.message}`); }
}

/* ── 删除 ── */
async function deleteTask(taskId) {
  if (!confirm('确认要删除该任务吗？此操作不可恢复。')) return;
  try {
    const { res, data } = await fetchJson(`/api/live/delete/${taskId}`, { method: 'POST' }, 15000);
    if (!res.ok || data.error) throw new Error(data.error ?? `HTTP ${res.status}`);
    removeTask(taskId); checkedIds.delete(taskId); renderTasks();
    if (taskId === activeTaskId) closeDrawer();
  } catch (err) { alert(`删除失败: ${err.message}`); }
}

/* ── 日志抽屉 ── */
function setLogDot(active) {
  logDot.className = `log-dot${active ? '' : ' inactive'}`;
}

/* ── 日志渲染核心 ──────────────────────────────────────────────────
   格式：2026-03-31 10:28:00 - INFO  - 信息内容
   系统信息：蓝色日期 + 深黄INFO + 淡灰正文
   策略信息：蓝色日期 + 深绿INFO + 原色正文
   错误信息：蓝色日期 + 红色ERROR + 原色正文
   ---------------------------------------------------------------- */
const _LOG_TS_RE = /^(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s*-\s*(\w+)\s*-\s*([\s\S]*)$/;

function _nowStamp() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function _isStrategyLine(level, msg) {
  // 错误/警告不算策略
  if (/^(ERROR|CRITICAL)$/i.test(level)) return false;
  if (/^WARN/i.test(level)) return false;
  // 含HTTP错误码的属于系统
  if (/401|403|Unauthorized|Client Error|Connection Error/i.test(msg)) return false;
  return true;
}

function _buildLogRow(ts, level, msg, isStrategy) {
  const row = document.createElement('span');
  row.className = 'log-line';

  const lvlUpper = (level || 'INFO').toUpperCase().padEnd(5);

  let lvlClass, msgClass;
  if (/^ERROR|CRITICAL/.test(lvlUpper)) {
    lvlClass = 'log-lvl-error'; msgClass = 'log-msg';
  } else if (/^WARN/.test(lvlUpper)) {
    lvlClass = 'log-lvl-warn'; msgClass = 'log-msg';
  } else if (isStrategy) {
    lvlClass = 'log-lvl-strategy'; msgClass = 'log-msg';
  } else {
    lvlClass = 'log-lvl-system'; msgClass = 'log-msg-system';
  }

  row.innerHTML =
    `<span class="log-ts">${ts}</span>` +
    `<span class="log-sep"> - </span>` +
    `<span class="${lvlClass}">${lvlUpper}</span>` +
    `<span class="log-sep"> - </span>` +
    `<span class="${msgClass}">${msg.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>\n`;
  return row;
}

function _parseAndRender(text) {
  // 已是标准时间戳格式
  const m = _LOG_TS_RE.exec(text);
  if (m) {
    const [, ts, level, msg] = m;
    return _buildLogRow(ts, level, msg, _isStrategyLine(level, msg));
  }

  // [STDOUT] → 策略 print()，包装成标准格式
  if (/^\[STDOUT\]\s*/.test(text)) {
    const msg = text.replace(/^\[STDOUT\]\s*/, '');
    return _buildLogRow(_nowStamp(), 'INFO ', msg, true);
  }

  // [SYSTEM] → 系统消息
  if (/^\[SYSTEM\]\s*/.test(text)) {
    const msg = text.replace(/^\[SYSTEM\]\s*/, '');
    return _buildLogRow(_nowStamp(), 'INFO ', msg, false);
  }

  // [ERROR] → 错误
  if (/^\[ERROR\]\s*/.test(text)) {
    const msg = text.replace(/^\[ERROR\]\s*/, '');
    return _buildLogRow(_nowStamp(), 'ERROR', msg, false);
  }

  // [INFO] 系统启动信息
  if (/^\[INFO\]\s*/.test(text)) {
    const msg = text.replace(/^\[INFO\]\s*/, '');
    return _buildLogRow(_nowStamp(), 'INFO ', msg, false);
  }

  // 其他裸文本，当作系统信息
  return _buildLogRow(_nowStamp(), 'INFO ', text, false);
}

function appendLog(text, _cls) {
  if (logBox.textContent === '等待任务日志...') logBox.textContent = '';
  logBox.appendChild(_parseAndRender(text));
  if (autoScroll) logBox.scrollTop = logBox.scrollHeight;
}

function clearLog() { logBox.textContent = ''; }

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  document.getElementById('auto-scroll-btn').textContent = autoScroll ? '自动滚动 ✓' : '自动滚动';
  if (autoScroll) logBox.scrollTop = logBox.scrollHeight;
}

function classifyLine(text) { return 'info'; } // 保留兼容，实际不再使用

function closeLogStream() {
  logStreamExpectedClose = true;
  if (activeEventSource) { activeEventSource.close(); activeEventSource = null; }
}

function closeDrawer() {
  closeLogStream();
  logDrawer.classList.remove('open');
  activeTaskId = null;
  stopBtn.disabled = true;
  setLogDot(false);
}

async function stopActiveTask() {
  if (!activeTaskId) return;
  await stopTask(activeTaskId);
  appendLog('[SYSTEM] 已发送停止请求。', 'system');
}

function viewTask(taskId) {
  const task = tasks.find(t => t.task_id === taskId);
  activeTaskId = taskId;
  closeLogStream();
  logStreamExpectedClose = false;
  logBox.textContent = '连接日志流中...';
  logDrawerTitle.textContent = task ? `实时日志 — ${task.name || task.task_id}` : '实时日志';
  stopBtn.disabled = !(task?.can_stop);
  setLogDot(true);
  logDrawer.classList.add('open');
  logDrawer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const es = new EventSource(`/api/stream/live/${taskId}`);
  activeEventSource = es;
  let reconnectNotified = false, streamStopped = false;
  const guard = () => activeEventSource === es && activeTaskId === taskId;

  es.addEventListener('open', () => {
    if (!guard()) return;
    if (logBox.textContent === '连接日志流中...') logBox.textContent = '';
    else if (reconnectNotified) appendLog('[SYSTEM] 日志流已恢复。', 'system');
    reconnectNotified = false;
  });

  es.addEventListener('log', ev => {
    if (!guard()) return;
    try {
      const text = JSON.parse(ev.data).text ?? '';
      appendLog(text, classifyLine(text));
    } catch (_) { appendLog(ev.data); }
  });

  es.addEventListener('status', async () => {
    if (!guard()) return;
    await loadTasks();
    stopBtn.disabled = !(tasks.find(t => t.task_id === taskId)?.can_stop);
  });

  es.addEventListener('stopped', async ev => {
    if (!guard()) return;
    streamStopped = true;
    let detail = ev.data;
    try { const d = JSON.parse(ev.data); detail = `status=${d.status ?? '-'} returncode=${d.returncode ?? '-'}`; } catch (_) {}
    appendLog(`[SYSTEM] 任务已结束，${detail}`, 'system');
    stopBtn.disabled = true;
    setLogDot(false);
    closeLogStream();
    await loadTasks();
  });

  es.addEventListener('stream-error', ev => {
    if (!guard()) return;
    streamStopped = true;
    let msg = '未知错误';
    try { msg = JSON.parse(ev.data || '{}').msg ?? msg; } catch (_) {}
    appendLog(`[SYSTEM] 日志流错误：${msg}`, 'error');
    setLogDot(false);
    closeLogStream();
  });

  es.addEventListener('error', () => {
    if (!guard() || logStreamExpectedClose || streamStopped) return;
    if (es.readyState === EventSource.CONNECTING) {
      if (!reconnectNotified) { appendLog('[SYSTEM] 日志流暂时断开，正在重连...', 'system'); reconnectNotified = true; }
      return;
    }
    appendLog('[SYSTEM] 日志流连接已关闭。', 'system');
    setLogDot(false);
    closeLogStream();
  });
}

/* ── 初始化 ── */
async function refreshAll() {
  try { await loadStrategies(); await loadTasks(); }
  catch (err) { console.error('刷新失败:', err.message); }
}

async function bootstrap() {
  await refreshAll();
  const initialTaskId = new URLSearchParams(window.location.search).get('task');
  if (initialTaskId) {
    const found = tasks.find(t => t.task_id === initialTaskId);
    if (found) viewTask(initialTaskId);
    else alert('未找到指定任务日志: ' + initialTaskId);
  }
  setInterval(() => loadTasks().catch(() => {}), 4000);
}
bootstrap();
</script>
